name: Release

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
    tags:
      - "v*"

jobs:
  archive:
    name: Archive
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ed_signature: ${{ steps.sparkle.outputs.ed_signature }}
      length: ${{ steps.sparkle.outputs.length }}
      build_version: ${{ steps.appcast.outputs.build_version }}
      pub_date: ${{ steps.appcast.outputs.pub_date }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install tools
        run: brew install xcodegen xcbeautify swiftlint

      - name: Generate build number xcconfig
        run: bash Scripts/set-build-number.sh

      - name: Generate project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --strict Sources/ Tests/

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.2.0-alpha"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Archive (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme Snap \
            -configuration Release \
            -archivePath build/Snap.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # TODO(#19): Replace ad-hoc signing above with Developer ID certificate,
      # then notarize and staple before creating the DMG.

      # TODO(#19): Restore xcodebuild -exportArchive with Developer ID signing.
      # For now, copy the app directly from the archive (no team/signing configured).
      - name: Export app
        run: |
          mkdir -p build/export
          cp -R build/Snap.xcarchive/Products/Applications/Snap.app build/export/Snap.app

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="build/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R build/export/Snap.app "$STAGE/Snap.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Snap ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "build/Snap-${VERSION}.dmg"

      - name: Sign update for Sparkle
        id: sparkle
        if: env.SPARKLE_EDDSA_KEY != ''
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="build/Snap-${VERSION}.dmg"
          SPARKLE_BIN="$(find SourcePackages/artifacts -name sign_update -not -path '*/old_dsa_scripts/*' | head -1)"
          if [ -z "$SPARKLE_BIN" ]; then
            SPARKLE_BIN="$(find ~/Library/Developer/Xcode/DerivedData/Snap-*/SourcePackages/artifacts -name sign_update -not -path '*/old_dsa_scripts/*' | head -1)"
          fi
          if [ -z "$SPARKLE_BIN" ]; then
            echo "Error: Could not locate Sparkle sign_update binary." >&2
            echo "Searched: SourcePackages/artifacts, ~/Library/Developer/Xcode/DerivedData/Snap-*/SourcePackages/artifacts" >&2
            exit 1
          fi
          SIGN_OUTPUT=$("$SPARKLE_BIN" "$DMG" --ed-key-file <(echo "$SPARKLE_EDDSA_KEY"))
          echo "Sparkle signature output:"
          echo "$SIGN_OUTPUT"
          echo "$SIGN_OUTPUT" > "build/sparkle-signature-${VERSION}.txt"

          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$LENGTH" ]; then
            LENGTH=$(stat -f%z "$DMG")
          fi
          if [ -z "$ED_SIGNATURE" ]; then
            echo "Error: Failed to parse edSignature from sign_update output." >&2
            exit 1
          fi
          case "$LENGTH" in
            ''|*[!0-9]*)
              echo "Error: Invalid DMG length \"$LENGTH\"; expected numeric byte count." >&2
              exit 1
              ;;
          esac
          echo "ed_signature=${ED_SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "length=${LENGTH}" >> "$GITHUB_OUTPUT"

      - name: Generate appcast snippet
        id: appcast
        if: steps.sparkle.outputs.ed_signature
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="$(grep CURRENT_PROJECT_VERSION Config/GeneratedBuildNumber.xcconfig | awk '{print $3}')"
          PUBDATE="$(date -u '+%a, %d %b %Y %H:%M:%S %z')"
          EDSIG="${{ steps.sparkle.outputs.ed_signature }}"
          LEN="${{ steps.sparkle.outputs.length }}"
          {
            echo "<item>"
            echo "  <title>Snap ${VERSION}</title>"
            echo "  <pubDate>${PUBDATE}</pubDate>"
            echo "  <sparkle:version>${BUILD}</sparkle:version>"
            echo "  <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            echo "  <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>"
            echo "  <enclosure"
            echo "    url=\"https://github.com/SteamedHamsAU/snap/releases/download/v${VERSION}/Snap-${VERSION}.dmg\""
            echo "    type=\"application/octet-stream\""
            echo "    sparkle:edSignature=\"${EDSIG}\""
            echo "    length=\"${LEN}\"/>"
            echo "</item>"
          } > build/appcast-snippet.xml
          echo ""
          echo "────── Appcast <item> ──────"
          cat build/appcast-snippet.xml
          echo "────────────────────────────"
          echo "build_version=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "pub_date=${PUBDATE}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snap-${{ steps.version.outputs.version }}.dmg
          path: |
            build/Snap-${{ steps.version.outputs.version }}.dmg
            build/sparkle-signature-*.txt
            build/appcast-snippet.xml

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Snap-${{ steps.version.outputs.version }}.dmg

      - name: Build release body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi
          echo "────── Release body ──────"
          cat release-body.md
          echo "──────────────────────────"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Snap ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body_path: release-body.md
          files: Snap-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true

  notify-website:
    name: Update website appcast
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      needs.archive.outputs.ed_signature != '' &&
      needs.archive.outputs.length != '' &&
      needs.archive.outputs.build_version != '' &&
      needs.archive.outputs.pub_date != ''
    needs: [archive, publish]
    runs-on: ubuntu-latest
    environment: website-deploy

    steps:
      - name: Dispatch to website
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.archive.outputs.version }}
          BUILD_VERSION: ${{ needs.archive.outputs.build_version }}
          ED_SIGNATURE: ${{ needs.archive.outputs.ed_signature }}
          LENGTH: ${{ needs.archive.outputs.length }}
          PUB_DATE: ${{ needs.archive.outputs.pub_date }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${TOKEN}" \
            https://api.github.com/repos/SteamedHamsAU/steamedhams-website/dispatches \
            -d "$(jq -n \
              --arg v "$VERSION" \
              --arg bv "$BUILD_VERSION" \
              --arg sig "$ED_SIGNATURE" \
              --arg len "$LENGTH" \
              --arg pd "$PUB_DATE" \
              '{
                event_type: "snap-release",
                client_payload: {
                  version: $v,
                  build_version: $bv,
                  ed_signature: $sig,
                  length: $len,
                  pub_date: $pd
                }
              }'
            )"
